name: Build SteamVita VPK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Vita-safe LiveArea assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)

          def write_indexed_png(path, width, height, accent=False):
              palette = bytes([
                  18, 20, 27,
                  29, 33, 43,
                  115, 164, 255,
                  240, 242, 247,
              ])

              rows = []
              for y in range(height):
                  row = bytearray([0] * width)
                  if accent:
                      if y < max(2, height // 7):
                          row[:] = bytes([1]) * width
                      stripe_y = max(2, height // 7)
                      if stripe_y <= y < stripe_y + max(2, height // 100):
                          row[:] = bytes([2]) * width
                      margin_x = max(8, width // 18)
                      box_top = height * 3 // 5
                      box_bottom = min(height, box_top + max(20, height // 6))
                      if box_top <= y < box_bottom:
                          for x in range(margin_x, width - margin_x):
                              row[x] = 1
                  else:
                      border = max(10, width // 8)
                      if border <= y < height - border:
                          for x in range(border, width - border):
                              row[x] = 2
                      inner = border + max(6, width // 10)
                      if inner <= y < height - inner:
                          for x in range(inner, width - inner):
                              row[x] = 1
                  rows.append(b'\x00' + bytes(row))

              ihdr = struct.pack('>IIBBBBB', width, height, 8, 3, 0, 0, 0)
              data = b'\x89PNG\r\n\x1a\n'
              data += chunk(b'IHDR', ihdr)
              data += chunk(b'PLTE', palette)
              data += chunk(b'IDAT', zlib.compress(b''.join(rows), 9))
              data += chunk(b'IEND', b'')
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_bytes(data)

          write_indexed_png('sce_sys/icon0.png', 128, 128, accent=False)
          write_indexed_png('sce_sys/livearea/contents/bg.png', 840, 500, accent=True)
          write_indexed_png('sce_sys/livearea/contents/startup.png', 280, 158, accent=True)
          PY

      - name: Install Vita libraries
        shell: bash
        run: |
          vdpm install libvita2d
          vdpm pacman -- -Rdd --noconfirm curl || true
          vdpm pacman -- -S --noconfirm curl-mbedtls zstd jansson

      - name: Fetch Steam and QR dependencies
        shell: bash
        run: |
          mkdir -p third_party assets

          git clone https://github.com/doctashay/libsteamdepot.git third_party/libsteamdepot
          git -C third_party/libsteamdepot checkout 9d618fd8e7c2455627b2dd035ee0c6dc60e913f8
          sed -i 's/SSL_get1_peer_certificate/SSL_get_peer_certificate/g' third_party/libsteamdepot/src/steam_cm.cpp
          sed -i 's/EVP_MD_CTX_new/EVP_MD_CTX_create/g; s/EVP_MD_CTX_free/EVP_MD_CTX_destroy/g' third_party/libsteamdepot/src/steam_cm.cpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('third_party/libsteamdepot/src/steam_cm.cpp')
          s = p.read_text()
          s = s.replace(
              '#if defined(SIGPIPE) && !(defined(__APPLE__) && defined(SO_NOSIGPIPE))',
              '#if defined(SIGPIPE) && !defined(STEAMVITA_VITA) && !(defined(__APPLE__) && defined(SO_NOSIGPIPE))')
          marker = 'using internal::le32;\n'
          helper = '''
std::string steamvita_hex_encode(const std::uint8_t* data, std::size_t size) {
    static constexpr char digits[] = "0123456789abcdef";
    std::string output(size * 2, '0');
    for (std::size_t i = 0; i < size; ++i) {
        output[i * 2] = digits[(data[i] >> 4u) & 0x0fu];
        output[i * 2 + 1] = digits[data[i] & 0x0fu];
    }
    return output;
}
'''
          if 'steamvita_hex_encode' not in s:
              s = s.replace(marker, marker + helper)
          s = s.replace('return hex_encode(digest, digest_size);',
                        'return steamvita_hex_encode(digest, digest_size);')
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('third_party/libsteamdepot/src/secret.cpp')
          s = p.read_text()
          s = s.replace(
              '#if defined(_WIN32)\n#include <windows.h>\n#else\n#include <sys/mman.h>\n#endif',
              '#if defined(_WIN32)\n#include <windows.h>\n#elif !defined(STEAMVITA_VITA)\n#include <sys/mman.h>\n#endif')
          s = s.replace(
              '#if defined(_WIN32)\n    locked_ = VirtualLock(bytes_.data(), bytes_.size()) != 0;\n#else\n    locked_ = ::mlock(bytes_.data(), bytes_.size()) == 0;\n#endif',
              '#if defined(_WIN32)\n    locked_ = VirtualLock(bytes_.data(), bytes_.size()) != 0;\n#elif defined(STEAMVITA_VITA)\n    locked_ = false;\n#else\n    locked_ = ::mlock(bytes_.data(), bytes_.size()) == 0;\n#endif')
          s = s.replace(
              '#if defined(_WIN32)\n    (void)VirtualUnlock(bytes_.data(), bytes_.size());\n#else\n    (void)::munlock(bytes_.data(), bytes_.size());\n#endif',
              '#if defined(_WIN32)\n    (void)VirtualUnlock(bytes_.data(), bytes_.size());\n#elif defined(STEAMVITA_VITA)\n    (void)0;\n#else\n    (void)::munlock(bytes_.data(), bytes_.size());\n#endif')
          p.write_text(s)
          PY

          git clone https://github.com/nayuki/QR-Code-generator.git third_party/qrcodegen
          git -C third_party/qrcodegen checkout 3c6d0b3cefb4e049dc337e82237c9644399716a8

          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            cp /etc/ssl/certs/ca-certificates.crt assets/cacert.pem
          else
            /usr/bin/curl -L --fail https://curl.se/ca/cacert.pem -o assets/cacert.pem
          fi

          test -s assets/cacert.pem

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Show build output
        run: ls -lah build

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: SteamVita-v0.3-real-library
          path: build/SteamVita.vpk
          if-no-files-found: error
