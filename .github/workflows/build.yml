name: Build SteamVita VPK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Vita-safe LiveArea assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)

          def write_indexed_png(path, width, height, accent=False):
              # 8-bit indexed PNG, no alpha. Vita LiveArea is picky about this format.
              palette = bytes([
                  18, 20, 27,      # 0 dark background
                  29, 33, 43,      # 1 panel
                  115, 164, 255,   # 2 accent
                  240, 242, 247,   # 3 light
              ])

              rows = []
              for y in range(height):
                  row = bytearray([0] * width)
                  if accent:
                      # Simple original SteamVita-style panel/stripe artwork.
                      if y < max(2, height // 7):
                          row[:] = bytes([1]) * width
                      stripe_y = max(2, height // 7)
                      if stripe_y <= y < stripe_y + max(2, height // 100):
                          row[:] = bytes([2]) * width
                      margin_x = max(8, width // 18)
                      box_top = height * 3 // 5
                      box_bottom = min(height, box_top + max(20, height // 6))
                      if box_top <= y < box_bottom:
                          for x in range(margin_x, width - margin_x):
                              row[x] = 1
                  else:
                      # Icon: blue inset square on a dark field.
                      border = max(10, width // 8)
                      if border <= y < height - border:
                          for x in range(border, width - border):
                              row[x] = 2
                      inner = border + max(6, width // 10)
                      if inner <= y < height - inner:
                          for x in range(inner, width - inner):
                              row[x] = 1
                  rows.append(b'\x00' + bytes(row))

              ihdr = struct.pack('>IIBBBBB', width, height, 8, 3, 0, 0, 0)
              data = b'\x89PNG\r\n\x1a\n'
              data += chunk(b'IHDR', ihdr)
              data += chunk(b'PLTE', palette)
              data += chunk(b'IDAT', zlib.compress(b''.join(rows), 9))
              data += chunk(b'IEND', b'')
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_bytes(data)

          write_indexed_png('sce_sys/icon0.png', 128, 128, accent=False)
          write_indexed_png('sce_sys/livearea/contents/bg.png', 840, 500, accent=True)
          write_indexed_png('sce_sys/livearea/contents/startup.png', 280, 158, accent=True)

          # Validate signature, IHDR format, dimensions, and every chunk CRC.
          expected = {
              'sce_sys/icon0.png': (128, 128),
              'sce_sys/livearea/contents/bg.png': (840, 500),
              'sce_sys/livearea/contents/startup.png': (280, 158),
          }
          for name, dims in expected.items():
              d = Path(name).read_bytes()
              assert d[:8] == b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II', d[16:24]) == dims
              assert d[24] == 8 and d[25] == 3
              pos = 8
              while pos < len(d):
                  size = struct.unpack('>I', d[pos:pos+4])[0]
                  kind = d[pos+4:pos+8]
                  payload = d[pos+8:pos+8+size]
                  stored = struct.unpack('>I', d[pos+8+size:pos+12+size])[0]
                  assert stored == (zlib.crc32(kind + payload) & 0xffffffff), (name, kind)
                  pos += 12 + size
                  if kind == b'IEND':
                      break
              print(name, 'OK')
          PY

      - name: Install Vita libraries
        run: vdpm install libvita2d

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Show build output
        run: ls -lah build

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: SteamVita-v0.1
          path: build/SteamVita.vpk
          if-no-files-found: error
