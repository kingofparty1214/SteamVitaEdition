name: Build SteamVita VPK

on:
  push:
    branches: [ main, "compat-runtime-*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Vita-safe LiveArea assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)

          def write_indexed_png(path, width, height, accent=False):
              palette = bytes([
                  18, 20, 27,
                  29, 33, 43,
                  115, 164, 255,
                  240, 242, 247,
              ])

              rows = []
              for y in range(height):
                  row = bytearray([0] * width)
                  if accent:
                      if y < max(2, height // 7):
                          row[:] = bytes([1]) * width
                      stripe_y = max(2, height // 7)
                      if stripe_y <= y < stripe_y + max(2, height // 100):
                          row[:] = bytes([2]) * width
                      margin_x = max(8, width // 18)
                      box_top = height * 3 // 5
                      box_bottom = min(height, box_top + max(20, height // 6))
                      if box_top <= y < box_bottom:
                          for x in range(margin_x, width - margin_x):
                              row[x] = 1
                  else:
                      border = max(10, width // 8)
                      if border <= y < height - border:
                          for x in range(border, width - border):
                              row[x] = 2
                      inner = border + max(6, width // 10)
                      if inner <= y < height - inner:
                          for x in range(inner, width - inner):
                              row[x] = 1
                  rows.append(b'\x00' + bytes(row))

              ihdr = struct.pack('>IIBBBBB', width, height, 8, 3, 0, 0, 0)
              data = b'\x89PNG\r\n\x1a\n'
              data += chunk(b'IHDR', ihdr)
              data += chunk(b'PLTE', palette)
              data += chunk(b'IDAT', zlib.compress(b''.join(rows), 9))
              data += chunk(b'IEND', b'')
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_bytes(data)

          write_indexed_png('sce_sys/icon0.png', 128, 128, accent=False)
          write_indexed_png('sce_sys/livearea/contents/bg.png', 840, 500, accent=True)
          write_indexed_png('sce_sys/livearea/contents/startup.png', 280, 158, accent=True)
          PY

      - name: Install Vita libraries
        shell: bash
        run: |
          vdpm install libvita2d
          vdpm pacman -- -Rdd --noconfirm curl || true
          vdpm pacman -- -S --noconfirm curl-mbedtls zstd

      - name: Fetch pinned dependencies
        shell: bash
        run: |
          mkdir -p third_party assets

          git clone https://github.com/nayuki/QR-Code-generator.git third_party/qrcodegen
          git -C third_party/qrcodegen checkout 3c6d0b3cefb4e049dc337e82237c9644399716a8

          git clone https://github.com/richgel999/miniz.git third_party/miniz
          git -C third_party/miniz checkout 2948eebafc5b9f1c69bebed80333e403a09bd62d

          # Upstream generates this header from its own CMake build. We compile
          # miniz statically inside SteamVita, so export decorations are no-ops.
          cat > third_party/miniz/miniz_export.h <<'EOF'
          #ifndef MINIZ_EXPORT_H
          #define MINIZ_EXPORT_H
          #define MINIZ_EXPORT
          #define MINIZ_NO_EXPORT
          #endif
          EOF

          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            cp /etc/ssl/certs/ca-certificates.crt assets/cacert.pem
          else
            /usr/bin/curl -L --fail https://curl.se/ca/cacert.pem -o assets/cacert.pem
          fi

          test -s assets/cacert.pem

          /usr/bin/curl -L --fail \
            https://raw.githubusercontent.com/TheOfficialFloW/VitaShell/81af70971ba18b8ce86215b04180f1e3d21cdfc9/resources/head.bin \
            -o assets/head.bin
          test "$(wc -c < assets/head.bin)" -eq 1072

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct

          template = bytearray(Path("assets/head.bin").read_bytes())
          if len(template) != 1072:
              raise SystemExit("unexpected head.bin size")

          def fpkg_hmac(data: bytes) -> bytes:
              first = hashlib.sha1(data).digest()
              block = bytearray(64)
              block[0:8] = first[4:12]
              block[8:16] = first[4:12]
              block[16:20] = first[12:16]
              block[20] = first[16]
              block[21] = first[1]
              block[22] = first[2]
              block[23] = first[3]
              block[24:32] = block[16:24]
              return hashlib.sha1(block).digest()[:16]

          def build(title_id: str, output: str):
              head = bytearray(template)
              content_id = f"EP9000-{title_id}_00-0000000000000000".encode("ascii")
              head[0x30:0x30+48] = b"\0" * 48
              head[0x30:0x30+len(content_id)] = content_id

              info_off = struct.unpack_from(">I", head, 0x08)[0]
              info_len = struct.unpack_from(">I", head, 0x10)[0]
              header_len = struct.unpack_from(">I", head, 0xD0)[0]
              info_out = struct.unpack_from(">I", head, 0xD4)[0]
              all_len = struct.unpack_from(">I", head, 0xE8)[0]

              head[header_len:header_len+16] = fpkg_hmac(head[:header_len])
              head[info_out:info_out+16] = fpkg_hmac(
                  head[info_off:info_off + info_len - 64]
              )
              head[all_len:all_len+16] = fpkg_hmac(head[:all_len])

              Path(output).write_bytes(head)

          build("STMVITA01", "assets/steamvita_package_head.bin")
          build("STMVUPD01", "assets/updater_package_head.bin")
          PY

          test "$(wc -c < assets/steamvita_package_head.bin)" -eq 1072
          test "$(wc -c < assets/updater_package_head.bin)" -eq 1072

      - name: Build updater helper
        shell: bash
        run: |
          cmake -S . -B build-helper             -DCMAKE_BUILD_TYPE=Release             -DSTEAMVITA_HELPER_ONLY=ON
          cmake --build build-helper --parallel 2
          cp build-helper/SteamVitaUpdater.vpk assets/SteamVitaUpdater.vpk
          test -s assets/SteamVitaUpdater.vpk

      - name: Configure SteamVita
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/heads/compat-runtime-* ]]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSTEAMVITA_BUILD_VERSION="0.13.${GITHUB_RUN_NUMBER}" -DSTEAMVITA_UPDATE_MANIFEST_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/dev-latest/update.txt"
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build SteamVita
        run: cmake --build build --parallel 2

      - name: Show build output
        shell: bash
        run: |
          ls -lah build/SteamVita.vpk
          ls -lah build-helper/SteamVitaUpdater.vpk

      - name: Upload VPKs
        uses: actions/upload-artifact@v4
        with:
          name: SteamVita-build-${{ github.run_number }}
          path: |
            build/SteamVita.vpk
            build-helper/SteamVitaUpdater.vpk
          if-no-files-found: error

      - name: Prepare development update manifest
        if: startsWith(github.ref, 'refs/heads/compat-runtime-')
        shell: bash
        run: |
          VERSION="0.13.${GITHUB_RUN_NUMBER}"
          SHA256="$(sha256sum build/SteamVita.vpk | awk '{print $1}')"
          {
            echo "version=$VERSION"
            echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/dev-latest/SteamVita.vpk"
            echo "sha256=$SHA256"
          } > update.txt
          cat update.txt

      - name: Publish development update
        if: startsWith(github.ref, 'refs/heads/compat-runtime-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          target_commitish: ${{ github.sha }}
          name: SteamVita Development
          prerelease: false
          make_latest: true
          files: |
            build/SteamVita.vpk
            update.txt

      - name: Read SteamVita version
        if: github.ref == 'refs/heads/main'
        id: app_version
        shell: bash
        run: |
          RAW="$(awk -F'"' '/set\\(VITA_VERSION/{print $2; exit}' CMakeLists.txt)"
          test -n "$RAW"
          if [[ "$RAW" == 00.* ]]; then
            VERSION="0.${RAW#00.}"
          else
            VERSION="$RAW"
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release manifest
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          TAG="${{ steps.app_version.outputs.tag }}"
          SHA256="$(sha256sum build/SteamVita.vpk | awk '{print $1}')"
          {
            echo "version=$VERSION"
            echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/SteamVita.vpk"
            echo "sha256=$SHA256"
          } > update.txt
          cat update.txt

      - name: Publish update release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SteamVita v${{ steps.app_version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            build/SteamVita.vpk
            update.txt
