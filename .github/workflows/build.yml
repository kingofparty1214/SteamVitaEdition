name: Build SteamVita VPK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Vita-safe LiveArea assets
        shell: bash
        run: |
          mkdir -p sce_sys/livearea/contents
          printf '%s' '' | base64 -d > sce_sys/icon0.png
          printf '%s' '' | base64 -d > sce_sys/livearea/contents/bg.png
          printf '%s' '' | base64 -d > sce_sys/livearea/contents/startup.png

          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('sce_sys/icon0.png'), Path('sce_sys/livearea/contents/bg.png'), Path('sce_sys/livearea/contents/startup.png')]:
              d=p.read_bytes()
              assert d[:8] == b'\x89PNG\r\n\x1a\n', p
              assert d[24] == 8 and d[25] == 3, (p, d[24], d[25])
              print(p, 'OK: 8-bit indexed PNG')
          PY

      - name: Install Vita libraries
        run: vdpm install libvita2d

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Show build output
        run: ls -lah build

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: SteamVita-v0.1
          path: build/SteamVita.vpk
          if-no-files-found: error
