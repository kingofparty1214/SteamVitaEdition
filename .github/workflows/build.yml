name: Build SteamVita VPK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Vita-safe LiveArea assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)

          def write_indexed_png(path, width, height, accent=False):
              palette = bytes([
                  18, 20, 27,
                  29, 33, 43,
                  115, 164, 255,
                  240, 242, 247,
              ])

              rows = []
              for y in range(height):
                  row = bytearray([0] * width)
                  if accent:
                      if y < max(2, height // 7):
                          row[:] = bytes([1]) * width
                      stripe_y = max(2, height // 7)
                      if stripe_y <= y < stripe_y + max(2, height // 100):
                          row[:] = bytes([2]) * width
                      margin_x = max(8, width // 18)
                      box_top = height * 3 // 5
                      box_bottom = min(height, box_top + max(20, height // 6))
                      if box_top <= y < box_bottom:
                          for x in range(margin_x, width - margin_x):
                              row[x] = 1
                  else:
                      border = max(10, width // 8)
                      if border <= y < height - border:
                          for x in range(border, width - border):
                              row[x] = 2
                      inner = border + max(6, width // 10)
                      if inner <= y < height - inner:
                          for x in range(inner, width - inner):
                              row[x] = 1
                  rows.append(b'\x00' + bytes(row))

              ihdr = struct.pack('>IIBBBBB', width, height, 8, 3, 0, 0, 0)
              data = b'\x89PNG\r\n\x1a\n'
              data += chunk(b'IHDR', ihdr)
              data += chunk(b'PLTE', palette)
              data += chunk(b'IDAT', zlib.compress(b''.join(rows), 9))
              data += chunk(b'IEND', b'')
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_bytes(data)

          write_indexed_png('sce_sys/icon0.png', 128, 128, accent=False)
          write_indexed_png('sce_sys/livearea/contents/bg.png', 840, 500, accent=True)
          write_indexed_png('sce_sys/livearea/contents/startup.png', 280, 158, accent=True)
          PY

      - name: Install Vita libraries
        shell: bash
        run: |
          vdpm install libvita2d
          vdpm install openssl
          vdpm install curl
          vdpm install xz
          vdpm install zstd
          vdpm install jansson

      - name: Fetch Steam and QR dependencies
        shell: bash
        run: |
          mkdir -p third_party assets

          git clone https://github.com/doctashay/libsteamdepot.git third_party/libsteamdepot
          git -C third_party/libsteamdepot checkout 9d618fd8e7c2455627b2dd035ee0c6dc60e913f8

          git clone https://github.com/nayuki/QR-Code-generator.git third_party/qrcodegen
          git -C third_party/qrcodegen checkout 3c6d0b3cefb4e049dc337e82237c9644399716a8

          python3 - <<'PY'
          from pathlib import Path

          path = Path('third_party/libsteamdepot/src/c_api.cpp')
          source = path.read_text()

          patch = r'''
          extern "C" sd_status sd_session_copy_access_token_steamvita(
              const sd_session* session,
              sd_secret** output,
              sd_error_v1* error) {
              if (output)
                  *output = nullptr;
              if (!session || !output) {
                  return set_error(error, SD_INVALID_ARGUMENT,
                                   "session and token output are required");
              }
              if (session->access_token.empty()) {
                  return set_error(error, SD_NOT_READY,
                                   "Steam did not issue an access token");
              }
              try {
                  *output = new sd_secret(session->access_token.data(),
                                          session->access_token.size());
                  clear_error(error);
                  return SD_OK;
              } catch (...) {
                  return translate_exception(error);
              }
          }
          '''

          if 'sd_session_copy_access_token_steamvita' not in source:
              source += '\n' + patch + '\n'
              path.write_text(source)
          PY

          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            cp /etc/ssl/certs/ca-certificates.crt assets/cacert.pem
          else
            /usr/bin/curl -L --fail https://curl.se/ca/cacert.pem -o assets/cacert.pem
          fi

          test -s assets/cacert.pem

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Show build output
        run: ls -lah build

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: SteamVita-v0.3-real-library
          path: build/SteamVita.vpk
          if-no-files-found: error
